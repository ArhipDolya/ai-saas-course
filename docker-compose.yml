services:
  bot:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    command: ["watchfiles", "python -m app.main", "app", ".env"]

  api:
    build: .
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  frontend_node_modules:
