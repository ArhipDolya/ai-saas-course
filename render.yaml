services:
  - type: web
    name: finance-saas
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
